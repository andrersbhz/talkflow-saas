services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: talkflow
      POSTGRES_USER: talkflow
      POSTGRES_PASSWORD: talkflow
    ports:
      - "5432:5432"
    volumes:
      - talkflow_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - talkflow_redis:/data

volumes:
  talkflow_pg:
  talkflow_redis:
